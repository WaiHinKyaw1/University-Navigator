    University:
      type: object
      required: [id, name, nameEn, type, state, minScore, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
          description: Myanmar name
        nameEn:
          type: string
          description: English name
        abbreviation:
          type: ["string", "null"]
        type:
          type: string
          description: "government | private | technical | medical | education"
        state:
          type: string
          description: State/Region in Myanmar
        city:
          type: ["string", "null"]
        minScore:
          type: number
          description: Minimum total score required for admission
        description:
          type: ["string", "null"]
        admissionRequirements:
          type: ["string", "null"]
          description: Detailed admission requirements when available
        applicationProcess:
          type: ["string", "null"]
          description: Application steps when available
        duration:
          type: ["string", "null"]
          description: Typical program duration when available
        careerOutcomes:
          type: ["string", "null"]
          description: Career outcome information when available
        website:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        majors:
          type: array
          items:
            $ref: "#/components/schemas/Major"
        createdAt:
          type: string
          format: date-time

    UniversityInput:
      type: object
      required: [name, nameEn, type, state, minScore]
      properties:
