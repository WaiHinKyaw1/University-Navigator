        subjects:
          type: object
          properties:
            myanmar:
              type: ["number", "null"]
            english:
              type: ["number", "null"]
            mathematics:
              type: ["number", "null"]
            chemistry:
              type: ["number", "null"]
            physics:
              type: ["number", "null"]
            biology:
              type: ["number", "null"]
            history:
              type: ["number", "null"]
            geography:
