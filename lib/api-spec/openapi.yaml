        contactPhone:
          type: ["string", "null"]
        welcomeMessage:
          type: ["string", "null"]
        maintenanceMode:
          type: boolean
        maintenanceMessage:
          type: string

    # ── AUTH ──────────────────────────────────────────────────────────────
    RegisterInput:
      type: object
      required: [name, email, password]
