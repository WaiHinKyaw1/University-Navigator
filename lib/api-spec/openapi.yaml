openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Myanmar University Finder API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: universities
    description: University management
  - name: favorites
    description: Authenticated saved universities
  - name: majors
    description: Major / field of study management
  - name: categories
    description: Major category management
  - name: score
    description: Score calculator
  - name: chatbot
    description: AI university admission guide (Gemini / ChatGPT)
  - name: chat
    description: Student-to-student chat
  - name: news
    description: News and announcements
  - name: users
    description: User management
  - name: admin
    description: Admin operations
  - name: analytics
    description: Dashboard analytics
  - name: admission-guide
    description: Myanmar university admission PDF guide

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── AUTH ──────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new student account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── UNIVERSITIES ──────────────────────────────────────────────────────────
  /universities:
    get:
      operationId: listUniversities
      tags: [universities]
      summary: List all universities with optional filters and sorting
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: majorId
          in: query
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: compact
          in: query
          description: Return only fields needed for list cards and lightweight selectors
          schema:
            type: boolean
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [name, minScore, type, state]
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: List of universities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UniversityListResponse"
    post:
      operationId: createUniversity
      tags: [universities]
      summary: Create a university (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UniversityInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/University"

  /universities/{id}:
    get:
      operationId: getUniversity
      tags: [universities]
      summary: Get university details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: University detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/University"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateUniversity
      tags: [universities]
      summary: Update a university (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UniversityInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/University"
    delete:
      operationId: deleteUniversity
      tags: [universities]
      summary: Delete a university (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── FAVORITES ────────────────────────────────────────────────────────────
  /favorites:
    get:
      operationId: listFavorites
      tags: [favorites]
      summary: List the current user's saved universities
      responses:
        "200":
          description: Saved universities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Favorite"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /favorites/{universityId}:
    post:
      operationId: createFavorite
      tags: [favorites]
      summary: Save a university for the current user
      parameters:
        - name: universityId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteFavorite
      tags: [favorites]
      summary: Remove a university from the current user's Favorites
      parameters:
        - name: universityId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── MAJORS ───────────────────────────────────────────────────────────────
  /majors:
    get:
      operationId: listMajors
      tags: [majors]
      summary: List all majors / fields of study
      responses:
        "200":
          description: List of majors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Major"
    post:
      operationId: createMajor
      tags: [majors]
      summary: Create a major (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MajorInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Major"

  /majors/{id}:
    put:
      operationId: updateMajor
      tags: [majors]
      summary: Update a major (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MajorInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Major"
    delete:
      operationId: deleteMajor
      tags: [majors]
      summary: Delete a major (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── CATEGORIES ────────────────────────────────────────────
  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all major categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [categories]
      summary: Create a category (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"

  /categories/{id}:
    put:
      operationId: updateCategory
      tags: [categories]
      summary: Update a category (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: deleteCategory
      tags: [categories]
      summary: Delete a category (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── SCORE CALCULATOR ──────────────────────────────────────────────────────
  /score/calculate:
    post:
      operationId: calculateScore
      tags: [score]
      summary: Calculate matching universities based on G-12 scores
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScoreInput"
      responses:
        "200":
          description: Matching universities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScoreMatch"

  # ── CHATBOT ───────────────────────────────────────────────────────────────
  /chatbot/message:
    post:
      operationId: sendChatbotMessage
      tags: [chatbot]
      summary: Send a message to the AI university admission guide
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatbotMessageInput"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatbotResponse"

  # ── STUDENT CHAT ──────────────────────────────────────────────────────────
  /chat/rooms:
    get:
      operationId: listChatRooms
      tags: [chat]
      summary: List chat rooms / conversations
      responses:
        "200":
          description: List of chat rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatRoom"
    post:
      operationId: createChatRoom
      tags: [chat]
      summary: Create or find direct message room with another user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRoomInput"
      responses:
        "200":
          description: Chat room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatRoom"

  /chat/rooms/{roomId}/messages:
    get:
      operationId: getChatMessages
      tags: [chat]
      summary: Get messages in a chat room
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a message in a chat room
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "201":
          description: Sent message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"

  /chat/questions:
    get:
      operationId: listPeerQuestions
      tags: [chat]
      summary: List peer chat questions with recursive answers
      responses:
        "200":
          description: Question tree
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PeerChatMessage"
    post:
      operationId: createPeerQuestion
      tags: [chat]
      summary: Ask a public peer chat question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeerQuestionInput"
      responses:
        "201":
          description: Created question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeerChatMessage"

  /chat/messages/{messageId}/replies:
    post:
      operationId: createPeerReply
      tags: [chat]
      summary: Reply to a peer question or answer
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeerReplyInput"
      responses:
        "201":
          description: Created reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeerChatMessage"

  # ── NEWS ──────────────────────────────────────────────────────────────────
  /news:
    get:
      operationId: listNews
      tags: [news]
      summary: List news articles / announcements
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: News list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsListResponse"
    post:
      operationId: createNews
      tags: [news]
      summary: Create a news article (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsArticle"

  /news/{id}:
    get:
      operationId: getNews
      tags: [news]
      summary: Get a news article
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: News article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsArticle"
    put:
      operationId: updateNews
      tags: [news]
      summary: Update a news article (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsArticle"
    delete:
      operationId: deleteNews
      tags: [news]
      summary: Delete a news article (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── ADMISSION GUIDE ───────────────────────────────────────────────────────
  /admission-guide:
    get:
      operationId: getActiveAdmissionGuide
      tags: [admission-guide]
      summary: Get the current active Myanmar university admission PDF metadata
      responses:
        "200":
          description: Active admission guide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdmissionGuide"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admission-guide/download:
    get:
      operationId: downloadActiveAdmissionGuide
      tags: [admission-guide]
      summary: Download the current active admission PDF
      responses:
        "200":
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/admission-guides:
    get:
      operationId: listAdmissionGuides
      tags: [admission-guide, admin]
      summary: List all admission guide uploads (admin only)
      responses:
        "200":
          description: Admission guide list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdmissionGuideListResponse"

  /admin/admission-guides/{id}/activate:
    put:
      operationId: activateAdmissionGuide
      tags: [admission-guide, admin]
      summary: Set an admission guide as active (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdmissionGuide"

  /admin/admission-guides/{id}/download:
    get:
      operationId: downloadAdmissionGuide
      tags: [admission-guide, admin]
      summary: Download a specific admission guide PDF (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /admin/admission-guides/{id}:
    delete:
      operationId: deleteAdmissionGuide
      tags: [admission-guide, admin]
      summary: Delete an admission guide (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ── USERS (ADMIN) ─────────────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}/ban:
    post:
      operationId: banUser
      tags: [users]
      summary: Ban or unban a user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BanUserInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # ── ADMIN ANALYTICS ───────────────────────────────────────────────────────
  /admin/analytics/overview:
    get:
      operationId: getAnalyticsOverview
      tags: [analytics]
      summary: Get dashboard overview stats
      responses:
        "200":
          description: Overview stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverview"

  /admin/analytics/major-distribution:
    get:
      operationId: getMajorDistribution
      tags: [analytics]
      summary: Get distribution of students by major interest
      responses:
        "200":
          description: Major distribution
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MajorStat"

  /admin/analytics/registration-trend:
    get:
      operationId: getRegistrationTrend
      tags: [analytics]
      summary: Get user registration trend by month
      responses:
        "200":
          description: Registration trend
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrendPoint"

  # ── ADMIN AUDIT LOGS ──────────────────────────────────────────────────────
  /admin/audit-logs:
    get:
      operationId: listAuditLogs
      tags: [admin]
      summary: Get system audit logs (admin only)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"

  # ── SITE SETTINGS ─────────────────────────────────────────────────────────
  /settings:
    get:
      operationId: getSiteSettings
      tags: [admin]
      summary: Get public project settings
      responses:
        "200":
          description: Current project settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"

  /admin/settings:
    put:
      operationId: updateSiteSettings
      tags: [admin]
      summary: Update project settings (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSettingsInput"
      responses:
        "200":
          description: Updated project settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── STUDENTS LIST (for peer chat) ─────────────────────────────────────────
  /students:
    get:
      operationId: listStudents
      tags: [users]
      summary: List students to start a chat with
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Student list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentSummary"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    SiteSettings:
      type: object
      required: [id, projectName, tagline, academicYear, updatedAt]
      properties:
        id:
          type: integer
        projectName:
          type: string
        logoUrl:
          type: ["string", "null"]
        tagline:
