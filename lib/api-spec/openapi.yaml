        state:
          type: string
        city:
          type: ["string", "null"]
        minScore:
          type: number
        description:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        majorIds:
          type: array
          items:
            type: integer

    UniversityListResponse:
      type: object
      required: [universities, total, page, limit]
      properties:
        universities:
          type: array
          items:
