kind = "web"
previewPath = "/"
title = "Myanmar University Finder"
version = "1.0.0"
id = "artifacts/university-finder"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20622

[services.development]
run = "pnpm --filter @workspace/university-finder run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/university-finder", "run", "build" ]
publicDir = "artifacts/university-finder/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20622"
BASE_PATH = "/"
